<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Ciel & Soleil couchant Casamance -->
  <rect width="800" height="320" fill="url(#skyGrad)"/>
  <circle cx="680" cy="90" r="50" fill="#fef08a" opacity="0.85"/>
  <circle cx="680" cy="90" r="65" fill="#fef08a" opacity="0.3"/>

  <!-- Silhouettes de Palmiers de Casamance -->
  <path d="M120 220 Q125 150 140 100 Q150 150 155 220 Z" fill="#14532d"/>
  <path d="M140 100 Q100 80 70 95 Q110 95 140 100 Q140 60 110 50 Q135 75 140 100 Q160 55 180 50 Q155 75 140 100 Q180 80 205 95 Q165 95 140 100" fill="#15803d"/>
  
  <path d="M720 230 Q725 160 735 120 Q745 160 750 230 Z" fill="#14532d"/>
  <path d="M735 120 Q700 100 670 115 Q705 115 735 120 Q735 80 710 70 Q730 95 735 120 Q755 75 770 70 Q750 95 735 120 Q770 100 795 115 Q760 115 735 120" fill="#15803d"/>

  <!-- Route de brousse bitumée / Piste rouge -->
  <path d="M0 220 Q400 210 800 220 L800 320 L0 320 Z" fill="url(#groundGrad)"/>
  <path d="M0 245 Q400 235 800 245 L800 295 L0 295 Z" fill="#334155"/>
  <!-- Lignes blanches de la route -->
  <line x1="50" y1="270" x2="150" y2="270" stroke="#ffffff" stroke-width="6" stroke-dasharray="25, 20"/>
  <line x1="250" y1="270" x2="350" y2="270" stroke="#ffffff" stroke-width="6" stroke-dasharray="25, 20"/>
  <line x1="450" y1="270" x2="550" y2="270" stroke="#ffffff" stroke-width="6" stroke-dasharray="25, 20"/>
  <line x1="650" y1="270" x2="750" y2="270" stroke="#ffffff" stroke-width="6" stroke-dasharray="25, 20"/>

  <!-- Camion de fret lourd -->
  <g transform="translate(240, 140)">
    <!-- Remorque -->
    <rect x="20" y="20" width="220" height="90" rx="8" fill="url(#truckBody)" stroke="#047857" stroke-width="2"/>
    <rect x="30" y="30" width="200" height="15" rx="3" fill="#34d399" opacity="0.6"/>
    <!-- Texte sur la remorque -->
    <text x="130" y="75" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">E-DÉPÔT CASAMANCE</text>
    <text x="130" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#d1fae5" text-anchor="middle">TRANSPORT &amp; SÉQUESTRE WAVE</text>
    
    <!-- Cabine du camion -->
    <path d="M245 40 L285 40 L310 75 L310 110 L245 110 Z" fill="#1e3a8a"/>
    <!-- Pare-brise -->
    <path d="M280 45 L255 45 L255 70 L298 70 Z" fill="#93c5fd" opacity="0.85"/>
    <!-- Phare avant -->
    <circle cx="308" cy="95" r="5" fill="#fef08a"/>
    
    <!-- Roues du camion -->
    <circle cx="60" cy="115" r="18" fill="#1e293b"/>
    <circle cx="60" cy="115" r="8" fill="#94a3b8"/>
    <circle cx="100" cy="115" r="18" fill="#1e293b"/>
    <circle cx="100" cy="115" r="8" fill="#94a3b8"/>
    <circle cx="200" cy="115" r="18" fill="#1e293b"/>
    <circle cx="200" cy="115" r="8" fill="#94a3b8"/>
    <circle cx="280" cy="115" r="18" fill="#1e293b"/>
    <circle cx="280" cy="115" r="8" fill="#94a3b8"/>
  </g>
</svg>
