# ==============================================================================
# Configuration des tests automatisés E-DÉPÔT (Base H2 isolée en mémoire)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:edepot_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Sécurité & JWT pour l'environnement de test
edepot.jwt.secret=TestSuperSecretKeyForJwtSigningWithAtLeast256BitsLongRequiredByHmacSha256!
edepot.jwt.expiration-ms=3600000

# Administrateur de test
edepot.admin.email=admin.test@edepot.sn
edepot.admin.password=AdminTest2025!
edepot.admin.nom=Admin Test
edepot.admin.telephone=+221770000000

# Services tiers
edepot.wave.environment=sandbox
edepot.wave.api-key=
edepot.ors.api-key=
