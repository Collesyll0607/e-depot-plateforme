server.port=${PORT:8085}
server.address=0.0.0.0
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.mvc.servlet.load-on-startup=1

# Base de données : auto-détection du driver et du dialecte Hibernate (PostgreSQL sur Render, MySQL en local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/edepot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Pool HikariCP adapté aux hébergements cloud (Render Free PostgreSQL)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate (auto-détection du dialecte PostgreSQL / MySQL / H2 par Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
edepot.jwt.secret=${JWT_SECRET:EDepotSuperSecretKey2025ForJwtSigningWithAtLeast256BitsLong!}
edepot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initialisation sécurisée du premier administrateur (si aucun admin n'existe en base)
edepot.admin.email=${ADMIN_EMAIL:admin@edepot.sn}
edepot.admin.password=${ADMIN_INITIAL_PASSWORD:Admin2025!}
edepot.admin.nom=${ADMIN_NOM:Directeur E-Dépôt}
edepot.admin.telephone=${ADMIN_TEL:+221770000000}

# Intégrations externes
edepot.wave.environment=${WAVE_ENV:sandbox}
edepot.wave.api-key=${WAVE_API_KEY:}
edepot.ors.api-key=${ORS_API_KEY:}