server.port=${PORT:8085}

# Base de données MySQL (XAMPP / phpMyAdmin sur port 3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edepot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Configuration
edepot.jwt.secret=${JWT_SECRET:EDepotSuperSecretKey2025ForJwtSigningWithAtLeast256BitsLong!}
edepot.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initialisation sécurisée du premier administrateur (si aucun admin n'existe en base)
edepot.admin.email=${ADMIN_EMAIL:admin@edepot.sn}
edepot.admin.password=${ADMIN_INITIAL_PASSWORD:Admin2025!}
edepot.admin.nom=${ADMIN_NOM:Directeur E-Dépôt}
edepot.admin.telephone=${ADMIN_TEL:+221770000000}

# Intégrations externes
edepot.wave.environment=${WAVE_ENV:sandbox}
edepot.wave.api-key=${WAVE_API_KEY:}
edepot.ors.api-key=${ORS_API_KEY:}
